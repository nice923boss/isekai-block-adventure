<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isekai Block Adventure: Word Conquest</title>
<style>
:root{
  --purple:#7C3AED; --purple-d:#5b21b6;
  --sky:#0EA5E9; --sky-d:#0369a1;
  --red:#EF4444; --red-d:#b91c1c;
  --emerald:#10B981; --emerald-d:#047857;
  --gold:#FACC15; --gold-d:#ca8a04;
  --ink:#0b0820; --panel:#251d4d; --panel2:#2f2663; --text:#ffffff; --muted:#c4b5fd;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  color:var(--text);
  background-color:#140f2e;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.035) 2px,transparent 2px),
    linear-gradient(180deg,#1e1b4b,#0f0a24);
  background-size:32px 32px,32px 32px,100% 100%;
  background-attachment:fixed;
  font-family:"Segoe UI","Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  overflow-x:hidden;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:820px;margin:0 auto;padding:8px 12px 34px}
button{font:inherit;color:inherit}
.hidden{display:none !important}

/* ---------- block primitives ---------- */
.block{
  background:var(--panel);
  border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.10),0 6px 0 var(--ink);
}
.btn{
  --c:var(--purple);
  font-weight:900;letter-spacing:.5px;
  border:4px solid var(--ink);
  background:var(--c);color:#fff;
  padding:12px 22px;font-size:18px;cursor:pointer;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.30),inset 4px 4px 0 rgba(255,255,255,.30),0 6px 0 var(--ink);
  transition:transform .08s,box-shadow .08s,filter .15s;
  text-shadow:2px 2px 0 rgba(0,0,0,.35);
  touch-action:manipulation;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.30),inset 4px 4px 0 rgba(255,255,255,.30),0 2px 0 var(--ink)}
.btn.sky{--c:var(--sky)} .btn.green{--c:var(--emerald)} .btn.red{--c:var(--red)} .btn.gold{--c:var(--gold);color:var(--ink);text-shadow:none}
.btn.ghost{--c:#3f3a6b}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:8px;padding:6px 8px;margin-bottom:10px;position:sticky;top:6px;z-index:30;background:var(--panel2)}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:6px;font-weight:900;font-size:15px}
.brand-ico{font-size:20px}
.brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.keys{display:flex;gap:4px;padding:3px 5px;background:#120d2b;border:3px solid var(--ink)}
.slot{width:34px;height:26px;display:flex;align-items:center;justify-content:center;background:#1d1640;border:2px solid #3b3270}
.slot :is(svg,img){width:28px;height:auto}
.slot.got{background:#3b2f0a;border-color:var(--gold);box-shadow:0 0 10px rgba(250,204,21,.6)}
.slot.pop{animation:pop .6s}
.icon-btn{
  width:40px;height:40px;flex:none;font-size:19px;cursor:pointer;background:#3f3a6b;border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2),0 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;touch-action:manipulation;
}
.icon-btn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.2),0 1px 0 var(--ink)}
.lang-btn{
  flex:none;height:40px;padding:0 10px;font-weight:900;font-size:14px;cursor:pointer;background:var(--sky);border:3px solid var(--ink);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.3),0 4px 0 var(--ink);touch-action:manipulation;white-space:nowrap
}
.lang-btn:active{transform:translateY(3px);box-shadow:inset -3px -3px 0 rgba(0,0,0,.3),inset 3px 3px 0 rgba(255,255,255,.3),0 1px 0 var(--ink)}
.lang-btn span{opacity:.55}
.lang-btn span.on{opacity:1;text-decoration:underline;text-underline-offset:3px}

/* ---------- screens ---------- */
.screen{display:none}
.screen.active{display:block}

/* start */
.start{padding:18px 16px 22px;text-align:center}
.start h1{font-size:clamp(26px,6vw,40px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 var(--ink)}
.start h2{font-size:clamp(18px,4.5vw,26px);margin:4px 0 12px;color:#fff;text-shadow:3px 3px 0 var(--purple-d)}
.lineup{display:flex;justify-content:center;align-items:flex-end;gap:clamp(8px,3vw,24px);margin:10px 0 14px;flex-wrap:wrap}
.lineup .mini{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--muted)}
.lineup .mini :is(svg,img){width:clamp(54px,14vw,80px);height:auto;filter:drop-shadow(3px 3px 0 #000)}
.lineup .mini .k :is(svg,img){width:30px}
.story{font-size:16px;line-height:1.65;text-align:left;background:#1a1440;border:3px solid var(--ink);padding:12px 14px;margin:0 auto 12px;max-width:640px}
.how{text-align:left;max-width:640px;margin:0 auto 18px;font-size:15px;line-height:1.6}
.how h3{color:var(--sky);margin-bottom:4px;font-size:16px}
.how li{list-style:none;padding-left:26px;position:relative;margin:3px 0}
.how li::before{content:"";position:absolute;left:4px;top:7px;width:12px;height:12px;background:var(--gold);border:2px solid var(--ink)}
.how li:nth-child(2)::before{background:var(--emerald)} .how li:nth-child(3)::before{background:var(--sky)}

/* battle */
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px;font-weight:900;font-size:15px}
.stage-bar .tag{background:var(--purple);border:3px solid var(--ink);padding:2px 8px}
.stage-bar .turn{color:var(--muted)}
.arena{
  position:relative;overflow:hidden;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px;
  padding:10px 10px 14px;min-height:200px;margin-bottom:10px;
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);
}
.arena::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background-image:linear-gradient(rgba(0,0,0,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(0,0,0,.18) 2px,transparent 2px);background-size:24px 24px}
.arena[data-stage="0"]{background:linear-gradient(#38bdf8 0 66%,#22c55e 66% 72%,#a16207 72%)}
.arena[data-stage="1"]{background:linear-gradient(#1e1b4b 0 66%,#6d28d9 66% 72%,#2e1065 72%)}
.arena[data-stage="2"]{background:linear-gradient(#7f1d1d 0 40%,#c2410c 66%,#6b7280 66% 72%,#374151 72%)}
.arena[data-stage="1"]::before{content:"🌙";position:absolute;right:14px;top:8px;font-size:22px}
.arena[data-stage="0"]::before{content:"☁️";position:absolute;left:40%;top:6px;font-size:24px}
.arena[data-stage="2"]::before{content:"🔥";position:absolute;left:46%;top:8px;font-size:20px}
.fighter{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.f-name{font-weight:900;font-size:14px;background:rgba(11,8,32,.85);border:3px solid var(--ink);padding:2px 8px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hpbar{position:relative;width:100%;max-width:170px;height:20px;background:#3a0d0d;border:3px solid var(--ink)}
.hpfill{position:absolute;inset:0;transform-origin:left;background:linear-gradient(#f87171 0 40%,var(--red) 40%);transition:transform .45s ease-out}
.hpbar.hero .hpfill{background:linear-gradient(#fca5a5 0 40%,var(--red) 40%)}
.hptxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-shadow:1px 1px 0 #000,-1px -1px 0 #000}
.avatar{width:clamp(84px,24vw,150px);height:clamp(84px,24vw,150px);display:flex;align-items:flex-end;justify-content:center}
.avatar :is(svg,img){width:100%;height:auto;max-height:100%;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.55))}
.hero .avatar :is(svg,img){width:80%;animation:bob 1.6s steps(2) infinite}
.boss .avatar :is(svg,img){animation:bob 1.2s steps(2) infinite}
.boss[data-b="1"] .avatar :is(svg,img){filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 12px #e9d5ff) drop-shadow(4px 4px 0 rgba(0,0,0,.55))}
.boss[data-b="2"] .avatar :is(svg,img){filter:drop-shadow(0 0 10px #f97316) drop-shadow(4px 4px 0 rgba(0,0,0,.55))}
.avatar.enter :is(svg,img){animation:drop .6s ease-out,bob 1.2s steps(2) .6s infinite}
.avatar.hurt :is(svg,img){animation:hurt .5s steps(2)}
.avatar.shake{animation:shake .45s}
.avatar.dying :is(svg,img){animation:die .9s forwards}
.vs{z-index:2;align-self:center;font-weight:900;font-size:20px;color:var(--gold);text-shadow:3px 3px 0 var(--ink)}

/* question panel */
.qpanel{padding:12px;margin-bottom:10px}
.qtype{font-size:14px;font-weight:800;color:var(--muted);margin-bottom:6px}
.prompt-row{display:flex;align-items:flex-start;gap:10px}
.prompt{flex:1;min-width:0;font-size:clamp(18px,4.6vw,24px);font-weight:800;line-height:1.4;min-height:1.4em;word-wrap:break-word}
.blank{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--gold);color:var(--gold);text-align:center}
.blank.filled{color:var(--emerald);border-color:var(--emerald)}
.qgloss{font-size:15px;color:#a5f3fc;margin-top:4px;min-height:0}
.timer{position:relative;height:18px;margin:10px 0 12px;background:#0f0b26;border:3px solid var(--ink)}
.tfill{position:absolute;inset:0;transform-origin:left;background:linear-gradient(#7dd3fc 0 40%,var(--sky) 40%)}
.timer.low .tfill{background:linear-gradient(#fca5a5 0 40%,var(--red) 40%)}
.timer.low{animation:blink .5s steps(2) infinite}
.ttxt{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;text-shadow:1px 1px 0 #000}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{
  position:relative;min-height:64px;padding:10px 8px 10px 30px;cursor:pointer;
  font-size:clamp(17px,4.6vw,22px);font-weight:900;letter-spacing:.5px;
  background:linear-gradient(135deg,var(--purple),#4c1d95);border:4px solid var(--ink);
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.30),inset 4px 4px 0 rgba(255,255,255,.25),0 6px 0 var(--ink);
  transition:transform .1s,filter .15s;text-shadow:2px 2px 0 rgba(0,0,0,.4);touch-action:manipulation;
}
.card:nth-child(2){background:linear-gradient(135deg,var(--sky),#075985)}
.card:nth-child(3){background:linear-gradient(135deg,#a855f7,#6b21a8)}
.card:nth-child(4){background:linear-gradient(135deg,#0891b2,#164e63)}
.card .num{position:absolute;left:6px;top:6px;width:20px;height:20px;font-size:12px;line-height:16px;background:var(--gold);color:var(--ink);border:2px solid var(--ink);text-shadow:none}
.card .sp{position:absolute;right:6px;bottom:4px;font-size:13px;opacity:.8}
.card:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px)}
.card:active:not(:disabled){transform:translateY(4px);box-shadow:inset -4px -4px 0 rgba(0,0,0,.30),inset 4px 4px 0 rgba(255,255,255,.25),0 2px 0 var(--ink)}
.card:disabled{cursor:default}
.card.correct{background:var(--emerald) !important;box-shadow:0 0 0 4px #6ee7b7,0 0 24px var(--emerald),0 6px 0 var(--ink);animation:pop .4s}
.card.reveal{background:var(--emerald) !important;animation:pulse .8s 2}
.card.wrong{background:var(--red) !important;animation:shake .4s}
.card.dim{opacity:.45}

/* log */
.log{padding:8px 10px;font-size:14px;line-height:1.55;min-height:72px}
.log .ln{padding:2px 0;border-bottom:2px dashed rgba(255,255,255,.08)}
.log .ln:first-child{font-weight:800}
.log .crit{color:#6ee7b7} .log .miss{color:#fca5a5} .log .info{color:#c7d2fe} .log .good{color:var(--gold)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,5,24,.78)}
.modal{width:100%;max-width:500px;max-height:calc(100vh - 32px);overflow-y:auto;padding:18px 16px;text-align:center;animation:pop .35s}
.modal h2{font-size:clamp(22px,6vw,30px);margin-bottom:10px;text-shadow:3px 3px 0 var(--ink)}
.modal.fb{border-color:var(--ink);background:#3b0d1a}
.modal.fb h2{color:#fca5a5}
.fb-ans{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:900;background:var(--emerald);border:3px solid var(--ink);padding:4px 12px;margin-bottom:10px}
.fb-ans .icon-btn{width:34px;height:34px;font-size:16px}
.fb-line{font-size:17px;line-height:1.55;margin:6px 0;text-align:left}
.fb-line.zh{color:#a5f3fc}
.fb-ex{font-size:15px;line-height:1.55;text-align:left;background:rgba(0,0,0,.3);border:3px solid var(--ink);padding:8px 10px;margin:8px 0}
.fb-ex b{color:var(--gold)}
.fb-chose{font-size:14px;color:#fecaca;text-align:left;margin:6px 0}
.fb-next{font-weight:900;color:var(--gold);margin:10px 0 12px;font-size:17px}
.modal.keym{background:#2b2108}
.modal.keym h2{color:var(--gold)}
.bigkey{width:150px;margin:6px auto 10px;animation:keyin .9s ease-out}
.bigkey :is(svg,img){width:100%;height:auto;filter:drop-shadow(0 0 14px rgba(250,204,21,.8)) drop-shadow(4px 4px 0 #000)}
.keym p{font-size:18px;font-weight:800;margin:6px 0}
.keym .heal{color:#6ee7b7}
.end{max-width:560px}
.end.win{background:#1b1050}
.end.win h2{color:var(--gold)}
.end.lose{background:#3b0d0d}
.end.lose h2{color:var(--red);font-size:clamp(30px,8vw,44px)}
.portal-wrap{position:relative;width:180px;height:180px;margin:6px auto 12px}
.portal{position:absolute;inset:0;border-radius:50%;border:6px solid var(--ink);
  background:conic-gradient(var(--purple),var(--sky),#c084fc,var(--gold),var(--purple));animation:spin 2.2s linear infinite;box-shadow:0 0 40px var(--purple),0 0 80px var(--sky)}
.portal::after{content:"";position:absolute;inset:22%;border-radius:50%;background:radial-gradient(#fff,#c4b5fd 30%,#4c1d95 75%);animation:pulse 1.2s infinite}
.portal-wrap :is(svg,img){position:absolute;left:50%;bottom:-6px;width:70px;height:auto;transform:translateX(-50%);z-index:2;filter:drop-shadow(3px 3px 0 #000)}
.endkeys{display:flex;justify-content:center;gap:10px;margin:6px 0 10px}
.endkeys :is(svg,img){width:46px;height:auto;filter:drop-shadow(0 0 6px rgba(250,204,21,.7))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 16px}
.stat{background:rgba(0,0,0,.35);border:3px solid var(--ink);padding:8px 4px}
.stat b{display:block;font-size:26px;color:var(--gold)}
.stat span{font-size:13px;color:var(--muted)}
.end p.sub{font-size:16px;line-height:1.6;margin-bottom:8px}
.end .btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.lose-av{width:110px;margin:0 auto 8px;filter:grayscale(.6)}
.lose-av :is(svg,img){width:100%;height:auto;transform:rotate(90deg)}

/* ---------- fx ---------- */
#flash{position:fixed;inset:0;pointer-events:none;z-index:55;opacity:0;background:radial-gradient(circle,rgba(239,68,68,.15),rgba(239,68,68,.55))}
#flash.on{animation:flash .6s}
.fx{position:absolute;pointer-events:none;z-index:5}
.bolt{width:26px;height:26px;background:#fff;border:4px solid var(--purple);box-shadow:0 0 14px #fff,0 0 28px var(--purple),0 0 40px var(--sky)}
.chip{border:2px solid var(--ink)}
.slash{height:14px;background:repeating-linear-gradient(90deg,#fff 0 12px,var(--gold) 12px 24px);border:3px solid var(--ink);box-shadow:0 0 16px #fff}
.float{font-weight:900;font-size:28px;text-shadow:3px 3px 0 var(--ink);white-space:nowrap}
.confetti{position:fixed;top:-20px;width:12px;height:12px;border:2px solid var(--ink);z-index:65;pointer-events:none}

/* ---------- ComfyUI image assets ---------- */
img.gimg{display:block;-webkit-user-drag:none;user-select:none;pointer-events:none}
.avatar img.gimg{height:100%;object-fit:contain;object-position:center bottom}
.slot img.gimg{max-height:22px;object-fit:contain}
.slot:not(.got) img.gimg{filter:grayscale(1) brightness(.35);opacity:.7}
.lineup .mini img.gimg{height:clamp(54px,14vw,80px);object-fit:contain}
.lineup .mini .k img.gimg{height:auto}
.arena.has-img{background-size:cover !important;background-position:center bottom !important}
.arena.has-img::before,.arena.has-img::after{display:none}
.arena.has-img .f-name,.arena.has-img .hpbar{box-shadow:0 3px 0 rgba(0,0,0,.5)}
.start.has-img{background-size:cover;background-position:center}
.portal-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:pulse 1.4s infinite;filter:drop-shadow(0 0 24px var(--purple)) drop-shadow(0 0 40px var(--sky))}
.portal-wrap .portal-img + img.gimg{width:80px}

#credit{position:fixed;right:8px;bottom:4px;font-size:11px;color:rgba(220,220,235,.6);z-index:90;pointer-events:none}

/* ---------- keyframes ---------- */
@keyframes bob{0%{transform:translateY(0)}100%{transform:translateY(-4px)}}
@keyframes drop{0%{transform:translateY(-140px);opacity:0}70%{transform:translateY(8px);opacity:1}100%{transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
@keyframes hurt{0%,100%{opacity:1;filter:none}25%,75%{opacity:.35;filter:sepia(1) saturate(8) hue-rotate(-40deg)}50%{opacity:1}}
@keyframes die{0%{transform:none;opacity:1}30%{transform:rotate(-8deg) scale(1.08)}100%{transform:translateY(40px) rotate(25deg) scale(.4);opacity:0}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes pulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
@keyframes blink{50%{border-color:var(--red)}}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes keyin{0%{transform:translateY(-60px) rotate(-540deg) scale(.2);opacity:0}70%{transform:rotate(10deg) scale(1.15);opacity:1}100%{transform:none}}

@media (max-width:520px){
  .brand{font-size:13px}
  .slot{width:28px;height:24px}
  .slot :is(svg,img){width:22px}
  .card{min-height:58px;padding-left:28px}
  .stage-bar{font-size:13px}
  .vs{font-size:16px}
  .arena{min-height:180px;padding:8px 6px 12px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar block">
    <div class="brand"><span class="brand-ico">⛏️</span><span data-i18n="brand"></span></div>
    <div class="keys" id="keyBar"></div>
    <button class="icon-btn" id="muteBtn" type="button">🎵</button>
    <button class="lang-btn" id="langBtn" type="button"><span data-l="en">EN</span> / <span data-l="zh">中文</span></button>
  </header>

  <main>
    <!-- START -->
    <section class="screen active" id="startScreen">
      <div class="start block">
        <h1 data-i18n="title"></h1>
        <h2 data-i18n="subtitle"></h2>
        <div class="lineup" id="lineup"></div>
        <p class="story" data-i18n="story"></p>
        <div class="how">
          <h3 data-i18n="howTitle"></h3>
          <ul><li data-i18n="how1"></li><li data-i18n="how2"></li><li data-i18n="how3"></li></ul>
        </div>
        <button class="btn gold" id="startBtn" type="button" data-i18n="start"></button>
      </div>
    </section>

    <!-- BATTLE -->
    <section class="screen" id="battleScreen">
      <div class="stage-bar block"><span class="tag" id="stageLabel"></span><span class="turn" id="turnLabel"></span></div>
      <div class="arena" id="arena" data-stage="0">
        <div class="fighter hero">
          <div class="f-name" id="heroName"></div>
          <div class="hpbar hero"><div class="hpfill" id="heroHp"></div><span class="hptxt" id="heroHpTxt"></span></div>
          <div class="avatar" id="heroAv"></div>
        </div>
        <div class="vs">VS</div>

const imgTag = name => `<img class="gimg" src="${IMG[name]}" alt="" draggable="false">`;

function sprite(name, palOverride) {
  if (!palOverride && IMG[name]) return imgTag(name);
  const s = SPR[name], pal = Object.assign({}, s.pal, palOverride || {});
  const h = s.rows.length, w = s.rows[0].length;
  let r = "";
  s.rows.forEach((row, y) => {
    if (row.length !== w) console.warn("sprite row width mismatch", name, y);
    let x = 0;
    while (x < w) {
      const c = row[x];
      if (c === ".") { x++; continue; }
      let n = 1;
      while (x + n < w && row[x + n] === c) n++;
      r += `<rect x="${x}" y="${y}" width="${n}" height="1" fill="${pal[c]}"/>`;
      x += n;
    }
  });
  return `<svg viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${r}</svg>`;
}
const keySprite = i => {
  const n = KEY_IMG[i < 0 ? 2 : i];
  return IMG[n] ? imgTag(n) : sprite("key", { c: i < 0 ? KEY_EMPTY : KEY_COL[i] });
};

/* ================= AUDIO (Web Audio synth) ================= */
let actx = null, muted = false;
function ac() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (C) actx = new C();
  }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, start, dur, type, vol, endFreq) {
  const a = ac(); if (!a || muted) return;
  const t0 = a.currentTime + start;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t0);
  if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(start, dur, vol) {
  const a = ac(); if (!a || muted) return;
  const len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
  f.type = "lowpass"; f.frequency.value = 900;
  src.buffer = buf; g.gain.value = vol || 0.25;
  src.connect(f).connect(g).connect(a.destination);
  src.start(a.currentTime + start);
}

const hasTts = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
let enVoice = null;
function pickVoice() {
  if (!hasTts) return;
  const vs = speechSynthesis.getVoices();
  enVoice = vs.find(v => /en[-_]US/i.test(v.lang) && /Google|Microsoft|Samantha|Aria|Jenny/i.test(v.name))
         || vs.find(v => /en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
if (hasTts) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text) {
  if (!hasTts || !text) return;
  speechSynthesis.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; if (enVoice) u.voice = enVoice;
    u.rate = 0.9; u.pitch = 1;
    speechSynthesis.speak(u);
  }, 60);
}
function primeTts() {
  if (!hasTts) return;
  const u = new SpeechSynthesisUtterance(" "); u.volume = 0;
  speechSynthesis.speak(u);
}

const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
};

function buildPool(stage) {
  const pairs = VOCAB.filter(v => v.st === stage).flatMap(v => [{ v, type: "def" }, { v, type: "cloze" }]);
  let best = shuffle(pairs);
  for (let tries = 0; tries < 30; tries++) {
    const ok = best.every((p, i) => i === 0 || best[i - 1].v !== p.v);
    if (ok) break;
    best = shuffle(pairs);
  }
  return best;
}

let tStart = 0, tRaf = 0, tRunning = false, pausedAt = 0;
function startTimer() {
  tStart = performance.now(); tRunning = true;
  $("timer").classList.remove("low");
  cancelAnimationFrame(tRaf);
  tRaf = requestAnimationFrame(tick);
}
function tick(now) {
  if (!tRunning) return;
  const left = Math.max(0, LIMIT - (now - tStart) / 1000);
  $("tFill").style.transform = `scaleX(${left / LIMIT})`;
  $("tTxt").textContent = Math.ceil(left);
  $("timer").classList.toggle("low", left <= 5);
  if (left <= 0) { tRunning = false; onTimeout(); return; }
  tRaf = requestAnimationFrame(tick);
}
function stopTimer() { tRunning = false; cancelAnimationFrame(tRaf); $("timer").classList.remove("low"); }
function resetTimerBar() { $("tFill").style.transform = "scaleX(1)"; $("tTxt").textContent = LIMIT; }
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { pausedAt = performance.now(); }
  else if (pausedAt) { if (tRunning) tStart += performance.now() - pausedAt; pausedAt = 0; }
});

function centerIn(el, box) {
  const r = el.getBoundingClientRect(), b = box.getBoundingClientRect();
  return { x: r.left - b.left + r.width / 2, y: r.top - b.top + r.height / 2, w: r.width, h: r.height };
}
function fxEl(cls, x, y, w, h, extra) {
  const d = document.createElement("div");
  d.className = "fx " + cls;
  d.style.left = (x - w / 2) + "px"; d.style.top = (y - h / 2) + "px";
  if (w) d.style.width = w + "px"; if (h) d.style.height = h + "px";
  if (extra) Object.assign(d.style, extra);
  $("arena").appendChild(d);

}
function castSpell(done) {

    { transform: "translate(0,0) rotate(0deg) scale(.6)" },
    { transform: `translate(${(b.x - h.x) / 2}px,${(b.y - h.y) / 2 - 30}px) rotate(180deg) scale(1.2)`, offset: .5 },
    { transform: `translate(${b.x - h.x}px,${b.y - h.y}px) rotate(360deg) scale(1)` }
  ], { duration: 420, easing: "ease-in" });
  anim.onfinish = () => {

      { transform: "rotate(-35deg) scaleX(0)", opacity: 1 },
      { transform: "rotate(-35deg) scaleX(1)", opacity: 1, offset: .5 },

    // block explosion

      const c = fxEl("chip", b.x, b.y, s, s, { background: cols[i % cols.length] });

function lockCards(pickIdx) {
  const ans = S.q.opts.indexOf(S.q.v);
  document.querySelectorAll(".card").forEach((c, i) => {
    c.disabled = true;
    if (i === ans) c.classList.add(pickIdx === ans ? "correct" : "reveal");
    else if (i === pickIdx) c.classList.add("wrong");
    else c.classList.add("dim");
  });
}
function answer(i) {
  if (S.phase !== "question" || !S.q || i < 0 || i >= S.q.opts.length) return;
  S.phase = "anim"; stopTimer();
  const pick = S.q.opts[i], ok = pick === S.q.v;
  lockCards(i);
  S.turns++;
  if (ok) {
    S.hits++;
    SFX.correct();
    if (S.q.type === "cloze") renderQuestionText(true);
    speak(S.q.v.w);
    castSpell(() => {
      S.bossHp = Math.max(0, S.bossHp - DMG);
      renderHp();
      floatText("bossAv", "-" + DMG, "#FACC15");
      addLog("logCrit", { word: S.q.v.w.toUpperCase() }, "crit");
      setTimeout(() => (S.bossHp <= 0 ? bossDown() : nextTurn()), 950);
    });
  } else {
    S.lastPick = pick;
    fail();
  }
}
function onTimeout() {
  if (S.phase !== "question") return;
  S.phase = "anim"; S.turns++; S.timedOut = true; S.lastPick = null;
  lockCards(-1);
  fail();
}
function fail() {
  SFX.wrong();
  screenShakeRed();
  setTimeout(showFeedback, 600);
}

/* --- feedback popup --- */
function renderFeedback() {
  const v = S.q.v, p = S.lastPick;
  const sentence = v.s.split("___").map(esc).join(`<b>${esc(v.w)}</b>`);
  const lc = s => s.charAt(0).toLowerCase() + s.slice(1);
  let h = `<h2>${esc(t(S.timedOut ? "fbTimeTitle" : "fbTitle"))}</h2>`;
  h += `<div class="fb-ans">${esc(t("fbAnswer"))} ${esc(v.w.toUpperCase())}` +
       (hasTts ? ` <button class="icon-btn" type="button" id="fbSpeak" aria-label="${esc(t("speakTip"))}">🔊</button>` : "") + `</div>`;
  h += `<p class="fb-line">${esc(t("fbMean", { word: v.w.charAt(0).toUpperCase() + v.w.slice(1), def: lc(v.def) }))}</p>`;
  if (lang === "zh") h += `<p class="fb-line zh">${esc(v.w)}（${esc(v.zh)}）：${esc(v.zhDef)}</p>`;
  h += `<div class="fb-ex">${esc(t("fbExample"))} ${sentence}` +
       (lang === "zh" ? `<br><span style="color:#a5f3fc">${esc(v.zs.replace(/[【】]/g, ""))}</span>` : "") + `</div>`;
  if (p) h += `<p class="fb-chose">${esc(t("fbChose", { w: p.w, def: lc(p.def), zh: p.zh, zhDef: p.zhDef }))}</p>`;
  h += `<p class="fb-next">${esc(t("fbNext"))}</p>`;
  h += `<button class="btn red" type="button" id="fbBtn">${esc(t("fbBtn"))}</button>`;
  $("fbModal").innerHTML = h;
  $("fbBtn").onclick = closeFeedback;
  if ($("fbSpeak")) $("fbSpeak").onclick = () => speak(`${v.w}. ${v.w} means ${lc(v.def)}`);
}
function showFeedback() {
  S.phase = "modal"; S.modal = "fb";
  renderFeedback();
  $("fbOverlay").classList.remove("hidden");
  const v = S.q.v;
  speak(`Spell backfire! ${v.w} means ${v.def.charAt(0).toLowerCase() + v.def.slice(1)}`);
  setTimeout(() => $("fbBtn") && $("fbBtn").focus(), 50);
}
function closeFeedback() {
  if (S.modal !== "fb") return;
  SFX.click();
  if (hasTts) speechSynthesis.cancel();
  $("fbOverlay").classList.add("hidden"); S.modal = null; S.phase = "anim";
  bossLunge(() => {
    SFX.hit();
    S.heroHp = Math.max(0, S.heroHp - HURT);
    renderHp();
    retrigger($("heroAv"), "hurt");
    floatText("heroAv", "-" + HURT, "#EF4444");
    addLog(S.timedOut ? "logTimeout" : "logMiss", { b: S.stage }, "miss");
    setTimeout(() => (S.heroHp <= 0 ? lose() : nextTurn()), 900);
  });
}

/* --- boss defeated / key --- */
function bossDown() {
  S.phase = "anim";
  SFX.bossDown();
  $("bossAv").classList.add("dying");
  addLog("logBossDown", { b: S.stage }, "good");
  setTimeout(() => {
    S.keys = S.stage + 1;
    S.heroHp = Math.min(HERO_MAX, S.heroHp + HEAL);
    renderKeys(S.stage); renderHp();
    floatText("heroAv", "+" + HEAL, "#10B981");
    addLog("logHeal", { k: S.stage }, "good");
    SFX.key();
    S.modal = "key"; S.phase = "modal";
    renderKeyModal();
    $("keyOverlay").classList.remove("hidden");
    setTimeout(() => $("keyBtn") && $("keyBtn").focus(), 50);
  }, 950);
}
function renderKeyModal() {
  const last = S.stage >= 2;
  $("keyModal").innerHTML =
    `<h2>${esc(t("keyTitle"))}</h2>` +
    `<div class="bigkey">${keySprite(S.stage)}</div>` +
    `<p>${esc(t("keyGot", { k: S.stage }))}</p>` +
    `<p class="heal">${esc(t("keyHeal"))}</p><br>` +
    `<button class="btn ${last ? "" : "gold"}" type="button" id="keyBtn">${esc(t(last ? "keyPortal" : "keyNext"))}</button>`;
  $("keyBtn").onclick = () => {
    SFX.click();
    $("keyOverlay").classList.add("hidden"); S.modal = null;
    if (last) win(); else { S.stage++; startStage(); }
  };
}

/* --- end screens --- */
function acc() { return S.turns ? Math.round(S.hits / S.turns * 100) : 0; }
function renderEnd() {
  const m = $("endModal");
  if (S.modal === "win") {
    m.className = "modal block end win";
    m.innerHTML =
      `<div class="portal-wrap">${IMG.portal ? `<img class="portal-img" src="${IMG.portal}" alt="" draggable="false">` : `<div class="portal"></div>`}${sprite("hero")}</div>` +
      `<h2>${esc(t("winTitle"))}</h2>` +
      `<div class="endkeys">${[0, 1, 2].map(keySprite).join("")}</div>` +
      `<p class="sub">${esc(t("winSub"))}</p>` +
      `<div class="stats">` +
        `<div class="stat"><b>${S.turns}</b><span>${esc(t("statTurns"))}</span></div>` +
        `<div class="stat"><b>${S.hits}</b><span>${esc(t("statHits"))}</span></div>` +
        `<div class="stat"><b>${acc()}%</b><span>${esc(t("statAcc"))}</span></div>` +
      `</div>` +
      `<div class="btns"><button class="btn gold" type="button" id="endMain">${esc(t("again"))}</button></div>`;
    $("endMain").onclick = () => { SFX.click(); startGame(); };
  } else {
    m.className = "modal block end lose";
    m.innerHTML =
      `<div class="lose-av">${sprite("hero")}</div>` +
      `<h2>${esc(t("loseTitle"))}</h2>` +
      `<p class="sub">${esc(t("loseSub", { b: S.stage }))}</p>` +
      `<div class="stats">` +
        `<div class="stat"><b>${S.turns}</b><span>${esc(t("statTurns"))}</span></div>` +
        `<div class="stat"><b>${S.keys}/3</b><span>🔑</span></div>` +
        `<div class="stat"><b>${acc()}%</b><span>${esc(t("statAcc"))}</span></div>` +
      `</div>` +
      `<div class="btns"><button class="btn red" type="button" id="endMain">${esc(t("retry"))}</button>` +
      `<button class="btn ghost" type="button" id="endAlt">${esc(t("restart"))}</button></div>`;
    $("endMain").onclick = retryBattle;
    $("endAlt").onclick = () => { SFX.click(); startGame(); };
  }
}
function win() {
  S.modal = "win"; S.phase = "modal";
  renderEnd();
  $("endOverlay").classList.remove("hidden");
  SFX.win(); confetti();
  speak("Portal opened! Welcome home!");
  setTimeout(() => $("endMain") && $("endMain").focus(), 50);
}
function lose() {
  S.modal = "lose"; S.phase = "modal";
  stopTimer();
  renderEnd();
  $("endOverlay").classList.remove("hidden");
  SFX.lose();
  speak("Defeated!");
  setTimeout(() => $("endMain") && $("endMain").focus(), 50);
}
function retryBattle() {
  SFX.click();
  hideOverlays();
  S.heroHp = HERO_MAX; S.log = [];
  renderLog();
  startStage();
}

/* ================= EVENTS ================= */
$("startBtn").onclick = () => { SFX.click(); startGame(); };
$("cards").addEventListener("click", e => {
  const c = e.target.closest(".card"); if (!c) return;
  answer(+c.dataset.i);
});
$("speakBtn").onclick = () => { if (S.q) speak(ttsText(S.q)); };
if (!hasTts) $("speakBtn").classList.add("hidden");
$("muteBtn").onclick = () => {
  muted = !muted;
  $("muteBtn").textContent = muted ? "🔇" : "🎵";
  if (!muted) SFX.click();
};
$("langBtn").onclick = () => {
  lang = lang === "en" ? "zh" : "en";
  try { localStorage.setItem("ibwc_lang", lang); } catch (e) { /* storage blocked */ }
  renderStatic();
  if ($("battleScreen").classList.contains("active")) {
    renderBattleHeader(); renderQuestionText(!!document.querySelector(".card.correct")); renderLog();
  }
  if (S.modal === "fb") renderFeedback();
  else if (S.modal === "key") renderKeyModal();
  else if (S.modal === "win" || S.modal === "lose") renderEnd();
};
document.addEventListener("keydown", e => {
  if (e.repeat) return;
  if (S.phase === "question" && /^[1-4]$/.test(e.key)) { answer(+e.key - 1); return; }
  if ((e.key === "Enter" || e.key === " ") && S.modal) {
    const b = S.modal === "fb" ? $("fbBtn") : S.modal === "key" ? $("keyBtn") : $("endMain");
    if (b && document.activeElement !== b) { e.preventDefault(); b.click(); }
  }
});

if (IMG.bg_title) {
  const st = document.querySelector(".start");
  st.classList.add("has-img");
  st.style.backgroundImage = `linear-gradient(rgba(20,12,50,.55),rgba(20,12,50,.82)),url("${IMG.bg_title}")`;
}
renderStatic();
})();
</script>
</body>
</html>
